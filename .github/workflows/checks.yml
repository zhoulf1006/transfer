name: Checks

# 质量门禁:每个 PR 与每次进 master 都跑。
# 与 build.yml 分开:那个只在打 tag 时触发、只负责打包发版,不做任何检查。
on:
  pull_request:
  push:
    branches:
      - master

# 同一分支上新的推送取消旧的运行,避免连续 push 时排队跑陈旧的提交。
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 必须在 setup-node 之前:setup-node 的 cache: 'pnpm' 会调用 pnpm 探测 store 路径。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不填 version:自动读取 package.json 的 packageManager 字段

      # 必须是 22,不能沿用 build.yml 的 20:测试经 src/main/db/messages.ts 加载
      # node:sqlite,该模块 Node 22.5 才有。build.yml 用 20 没暴露,是因为它只打包不跑测试。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # 根 vitest 的 include 覆盖 src/** 与 site/src/**,两侧测试一次跑完。
      - name: Test
        run: pnpm test

      # 构建期错误(模块解析、插件配置)typecheck 看不见,单独跑一次。
      - name: Build (electron-vite)
        run: pnpm build

      # site 有独立的 package.json / lockfile / node_modules,不在根 workspace 里。
      - name: Install site dependencies
        run: pnpm install --frozen-lockfile
        working-directory: site

      - name: Build site (Astro)
        run: pnpm build
        working-directory: site

  # e2e 驱动真实 Electron。与 checks 并行(不设 needs):两者互不依赖,并行的墙钟时间
  # 短于串行,而 checks 秒级反馈的价值不受影响。
  #
  # 跑 ubuntu 而非 macos:私有仓库 macOS runner 按 10 倍计费,而这些用例断言的是
  # DOM 几何与计算样式,与平台无关。macOS 专属面(签名、公证、TCC)本来就不在 e2e
  # 覆盖内,由本地验证与发版流程守。
  #
  # globalSetup 里的 quiet-electron.sh 有 darwin 守卫,Linux 上天然空操作——
  # CI 无 Dock,不需要 LSUIElement 副本。
  e2e:
    name: e2e (Electron)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 同 checks:必须 22,e2e 会加载主进程,而它经 messages.ts 用 node:sqlite
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron 与 Chromium 共用同一批系统库;交给 playwright 装,别手写 apt 包名——
      # 包名随 Ubuntu 版本漂移(libasound2 → libasound2t64),runner 升级日会全红。
      - name: Install system libs for Electron
        run: pnpm exec playwright install-deps chromium

      # Electron 需要显示服务;-a 自动挑空闲 display 号。
      # pnpm e2e 自带 electron-vite build——读构建产物的取证,产物必须是当次的。
      - name: Run e2e
        run: xvfb-run -a pnpm e2e

      # 不传的话 CI 红了只剩退出码,无从查起
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
