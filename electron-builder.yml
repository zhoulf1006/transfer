appId: com.loong.transfer
productName: Transfer

directories:
  output: release/${version}
  buildResources: build

# 打包末尾自动清理:release/ 下只保留最近 5 个版本目录(electron-builder 无内置保留配置,只写不删)。
# 脚本按 semver 排序删旧,保留数可用 KEEP_RELEASES 覆盖;删除失败只警告不拖垮打包。见 build/clean-old-releases.cjs。
# .cjs 后缀必需:package.json 是 type:module,普通 .js 会被当 ESM 导致 require 报错。
afterAllArtifactBuild: build/clean-old-releases.cjs

# electron-vite 输出到 out/;fastify 等 dependencies 由 builder 从 node_modules 收集
files:
  - out
  - package.json
asarUnpack:
  - '**/node_modules/fastify/**'

# 局域网直连需要网络权限;无签名(测试用,朋友端会有一次性安全提示)
win:
  target:
    - target: nsis            # 安装版:装到固定目录,标准向导(可选目录+快捷方式)
      arch: [x64]
    - target: portable        # 免安装版:双击即用(每次解压到临时目录,冷启动略慢)
      arch: [x64]
  # 明确不签名:CI runner 无证书时 signtool 仍被调用会失败。用 signExecutable(不是
  # signAndEditExecutable——后者只管主 exe,漏了 NSIS 的 setup/uninstaller)。
  # signExecutable:false 在读证书前短路,对主exe/setup/uninstaller/elevate 全生效,且保留图标元数据。
  signExecutable: false
  icon: build/icon.ico         # 应用图标(紫底 + 白色纸飞机,主色 #8a67ab)

# portable 产物名(win 标识 + 与 nsis 的 -win-setup.exe 区分)
portable:
  artifactName: ${productName}-${version}-win-portable.exe

# NSIS:标准安装向导 —— 用户能看到/选择安装目录、勾快捷方式(不再静默装到隐藏目录)
nsis:
  oneClick: false                        # 弹安装向导,不静默
  perMachine: false                      # 默认当前用户目录(无需管理员;向导里仍可改)
  allowToChangeInstallationDirectory: true # 允许用户选择安装目录
  createDesktopShortcut: true            # 创建桌面快捷方式
  createStartMenuShortcut: true          # 创建开始菜单快捷方式
  artifactName: ${productName}-${version}-win-setup.exe

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      # 三个产物,用户按机器自选(见 docs/adr/0010):
      #   universal 保底(不确定架构就下它,Intel+Apple 芯片通吃,单包 ~410MB)
      #   arm64     Apple 芯片专用(M 系列,~230MB,最小)
      #   x64       Intel 芯片专用(~230MB)
      # ${arch} 在 dmg 上解析为字面 universal/arm64/x64(x64 不变 x86_64);产物名见下方 dmg.artifactName。
      # 代价:三个最终 DMG 各自公证并 staple(正式版等待 ×3);构建更久。CI 产物 glob 是 *.dmg,自动兼容。
      arch: [universal, arm64, x64]
  # 裁掉 Chromium 自带的多余 locale.pak(55 个语系→只留这 3 个,省 ~40M)。裁的是浏览器 UI 串
  # (右键菜单/文件对话框),与用户输入/传输的日文法文内容无关(那些走 icudtl.dat+系统字体,均保留)。
  # 版本门槛:electron-builder <26 在 mac 上此选项静默失效(#9774);本项目 26.15.3 已含修复。
  # locale 码按磁盘 .lproj 名写(下划线,如 zh_CN 非 zh-CN),否则匹配不上被误删。三个架构对称裁剪,不破坏 universal 合并。
  electronLanguages: [en, en_GB, zh_CN]
  icon: build/icon.icns       # 应用图标(紫底 + 白色纸飞机,主色 #8a67ab)
  # 加固运行时 + entitlements(签名时生效;Electron/V8 加固运行时必需)。
  # CI:mac job 用 CSC_IDENTITY_AUTO_DISCOVERY:false → 无签名身份 → electron-builder 跳过签名,
  # 这些字段对未签名构建无副作用。本地 pnpm dist:mac:钥匙串有 Developer ID → 自动签名。
  hardenedRuntime: true                       # 公证前提:启用加固运行时
  gatekeeperAssess: false                      # 打包时不本地跑 Gatekeeper 评估(交给公证)
  entitlements: build/entitlements.mac.plist   # Electron/V8 加固运行时必需
  entitlementsInherit: build/entitlements.mac.plist
  # 内置公证:签完 .app、**打 DMG 之前**提交 Apple 并 `stapler staple` 到 .app 上
  # (app-builder-lib 的 notarizeIfProvided → @electron/notarize)。
  # 这一步不能省成"只公证最终 DMG":staple 到 DMG 的票据随 DMG 一起被丢掉,用户把 app 拖进
  # 「应用程序」后它身上没有票据,首次启动 Gatekeeper 只能联网查,断网即判"无法验证"。
  # 两处都要钉:app 的票据管"拖出来之后",DMG 的票据(build/notarize-dmgs.cjs)管"打开 DMG 时"。
  # 凭据缺失时 electron-builder 只 warn 后静默跳过,不报错 —— 兜底断言在 notarize-dmgs.cjs
  # 里(挂载 DMG 后对内部 .app 跑 stapler validate),漏配凭据会在那里失败。
  # 预发布档走 `pnpm dist:mac`,用 -c.mac.notarize=false 显式关掉(只签名不公证)。
  notarize: true

# Mac App Store —— 与上面的 Developer ID/DMG 线并行,两套产物互不影响。
# 继承 mac 的 category/icon/electronLanguages;下面只写必须覆盖的部分。
# 前置条件(缺任一项都跑不起来,不是配置能绕过的):
#   ① Apple Development 证书(mas-dev)/ Apple Distribution + Mac Installer Distribution(mas)
#   ② developer.apple.com 建 App ID com.loong.transfer,开 App Groups
#   ③ provisioning profile 放到下面指定的路径
# profile 是硬前置:沙盒放行 Electron MachPortRendezvousServer 的 Mach 名靠 profile 下发的
# com.apple.application-identifier;没有它主进程启动即 FATAL(bootstrap_check_in 1100),
# 且该 entitlement 无法手工伪造(AMFI 会直接拒绝加载二进制)。实测记录见 docs/postmortems/。
mas:
  # App Store 版用独立 bundle id(见 ADR-0016),与顶层的 com.loong.transfer 分开:
  #   ① 反向 DNS 该用实际持有的域名 aloongplanet.com,顶层那个是历史遗留;
  #   ② 同 bundle id 不同签名会让 TCC 混乱 —— 两个版本并存时权限互相顶掉(实测)。
  # 不改顶层:那会重置所有现存 DMG 用户的 TCC 授权,代价远大于收益。
  appId: com.aloongplanet.transfer
  # 架构走 CLI 的 --universal(见 package.json 的 dist:mas)。
  # 不写在这里:`--mac mas` 会覆盖配置里的 target 列表,写了也不生效,只会误导后来人。
  # 必须 universal —— Mac App Store 一个 app 只收一份二进制,arm64-only 会把 Intel 机器
  # 排除在外(与 DMG 线不同,那边靠三个产物让用户自选,见 ADR-0010)。
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  provisioningProfile: build/embedded.provisionprofile
  # 加固运行时是 Developer ID 公证那条线的要求,MAS 走沙盒,不启用。
  hardenedRuntime: false
  extendInfo:
    # macOS 15+ 本地网络隐私:访问局域网前系统会据此向用户说明用途。
    NSLocalNetworkUsageDescription: Transfer 需要访问本地网络来发现同一局域网内的设备并直接传输文件。
    # 沙盒只放行以 Team ID 打头的 Mach 服务名,Electron 靠这个键给 rendezvous server 命名。
    ElectronTeamID: RHQ28XS7D9

masDev:
  # 继承 mas,只换成开发用 profile(本机测沙盒行为,不上传)
  provisioningProfile: build/development.provisionprofile

dmg:
  # mac- 系统标识 + ${arch} 架构后缀。${arch} 必需:多架构时无它会同名互相覆盖。
  # 三产物解析为 -mac-universal / -mac-arm64 / -mac-x64(dmg 上 x64 保持 x64,不变 x86_64)。
  artifactName: ${productName}-${version}-mac-${arch}.dmg
  # 用打包阶段已导入的 Developer ID Application 证书签名最外层 DMG。
  # 正式版随后公证/staple 该同一文件；无证书构建会跳过签名。
  sign: true
